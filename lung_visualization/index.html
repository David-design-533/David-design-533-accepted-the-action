<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>肺部变化可视化模型 - 抽烟影响模拟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            color: white;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .visualization-panel {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 20px;
            min-height: 600px;
        }

        #canvas-container {
            width: 100%;
            height: 500px;
            background: linear-gradient(to bottom, #e0f7fa 0%, #b2ebf2 100%);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        .data-panel {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 20px;
        }

        .data-section {
            margin-bottom: 25px;
        }

        .data-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin: 5px 0;
            background: #f5f5f5;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .data-item:hover {
            background: #e8eaf6;
            transform: translateX(5px);
        }

        .data-label {
            font-weight: 600;
            color: #555;
        }

        .data-value {
            font-weight: bold;
            color: #667eea;
        }

        .data-value.warning {
            color: #ff9800;
        }

        .data-value.danger {
            color: #f44336;
        }

        .timeline-control {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .timeline-control h3 {
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
        }

        .slider-container {
            padding: 20px 10px;
        }

        .slider {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: linear-gradient(to right, #4caf50, #ffeb3b, #ff9800, #f44336);
            outline: none;
            opacity: 0.9;
            transition: opacity 0.2s;
            cursor: pointer;
        }

        .slider:hover {
            opacity: 1;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: white;
            border: 3px solid #667eea;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .slider::-moz-range-thumb {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: white;
            border: 3px solid #667eea;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .timeline-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }

        .current-stage {
            text-align: center;
            margin-top: 15px;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
        }

        .description-box {
            margin-top: 15px;
            padding: 15px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 5px;
            font-size: 0.95em;
            line-height: 1.6;
        }

        .comparison-mode {
            margin-top: 20px;
            text-align: center;
        }

        .btn {
            padding: 12px 25px;
            margin: 5px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .health-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .health-good {
            background: #4caf50;
        }

        .health-moderate {
            background: #ffeb3b;
        }

        .health-poor {
            background: #ff9800;
        }

        .health-critical {
            background: #f44336;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🫁 肺部变化可视化模型</h1>
            <p>抽烟后肺部结构和功能的长期影响模拟</p>
        </header>

        <div class="main-content">
            <div class="visualization-panel">
                <h2 style="color: #667eea; margin-bottom: 15px;">3D 肺部模型</h2>
                <div id="canvas-container">
                    <div class="loading" id="loading">
                        正在加载模型数据...
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress"></div>
                        </div>
                    </div>
                </div>
                <div style="text-align: center; margin-top: 10px; color: #666; font-size: 0.9em;">
                    💡 使用鼠标拖动旋转视角，滚轮缩放
                </div>
            </div>

            <div class="data-panel">
                <div class="data-section">
                    <h3>📊 肺功能指标</h3>
                    <div class="data-item">
                        <span class="data-label">FEV1（第一秒用力呼气量）</span>
                        <span class="data-value" id="fev1">100%</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">肺活量</span>
                        <span class="data-value" id="lung-volume">6000 ml</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">肺弹性</span>
                        <span class="data-value" id="elasticity">100%</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">肺泡健康度</span>
                        <span class="data-value" id="alveoli-health">100%</span>
                    </div>
                </div>

                <div class="data-section">
                    <h3>⚠️ 损伤指标</h3>
                    <div class="data-item">
                        <span class="data-label">焦油沉积</span>
                        <span class="data-value danger" id="tar-deposits">0 mg</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">PM2.5 浓度</span>
                        <span class="data-value danger" id="pm25">0 μg/m³</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">纤维化程度</span>
                        <span class="data-value warning" id="fibrosis">0%</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">肿瘤大小</span>
                        <span class="data-value danger" id="tumor-size">0 mm</span>
                    </div>
                </div>

                <div class="data-section">
                    <h3>🏥 健康状态</h3>
                    <div id="health-status" style="padding: 15px; border-radius: 8px; background: #e8f5e9;">
                        <span class="health-indicator health-good"></span>
                        <strong>健康</strong>
                        <p style="margin-top: 10px; font-size: 0.9em; color: #555;">
                            肺部功能正常，无明显病变
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="timeline-control">
            <h3>⏱️ 时间轴控制</h3>
            <div class="slider-container">
                <input type="range" min="0" max="30" value="0" class="slider" id="timeSlider">
                <div class="timeline-labels">
                    <span>健康</span>
                    <span>1年</span>
                    <span>5年</span>
                    <span>10年</span>
                    <span>20年</span>
                    <span>30年</span>
                </div>
            </div>
            <div class="current-stage" id="current-stage">
                吸烟 0 年 - 健康肺部
            </div>
            <div class="description-box" id="description">
                健康肺部基线模型 - 正常的呼吸功能和结构
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Global variables
        let scene, camera, renderer, controls;
        let lungGroup;
        let modelData = null;
        let currentStageIndex = 0;

        // Initialize Three.js scene
        function initScene() {
            const container = document.getElementById('canvas-container');
            
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xe0f7fa);
            
            // Camera
            camera = new THREE.PerspectiveCamera(
                50,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            camera.position.set(2, 1, 3);
            camera.lookAt(0, 0, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.innerHTML = '';
            container.appendChild(renderer.domElement);
            
            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 1.5;
            controls.maxDistance = 6;
            
            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            const pointLight = new THREE.PointLight(0xffffff, 0.4);
            pointLight.position.set(-5, 5, -5);
            scene.add(pointLight);
            
            // Lung group
            lungGroup = new THREE.Group();
            scene.add(lungGroup);
            
            // Animation loop
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            // Gentle breathing animation
            if (lungGroup) {
                const breathScale = 1 + Math.sin(Date.now() * 0.001) * 0.02;
                lungGroup.scale.set(breathScale, breathScale, breathScale);
            }
            
            renderer.render(scene, camera);
        }

        function createLungGeometry(geometryData) {
            // Clear existing geometry
            while (lungGroup.children.length > 0) {
                lungGroup.remove(lungGroup.children[0]);
            }
            
            geometryData.forEach(obj => {
                let mesh;
                const color = new THREE.Color(
                    obj.color[0],
                    obj.color[1],
                    obj.color[2]
                );
                
                const material = new THREE.MeshPhongMaterial({
                    color: color,
                    transparent: true,
                    opacity: obj.opacity,
                    shininess: 30
                });
                
                if (obj.type === 'ellipsoid') {
                    const geometry = new THREE.SphereGeometry(1, 32, 32);
                    mesh = new THREE.Mesh(geometry, material);
                    mesh.scale.set(obj.scale[0], obj.scale[1], obj.scale[2]);
                } else if (obj.type === 'cylinder') {
                    const geometry = new THREE.CylinderGeometry(
                        obj.radius,
                        obj.radius,
                        obj.height,
                        16
                    );
                    mesh = new THREE.Mesh(geometry, material);
                } else if (obj.type === 'sphere') {
                    const geometry = new THREE.SphereGeometry(obj.radius, 16, 16);
                    mesh = new THREE.Mesh(geometry, material);
                }
                
                if (mesh) {
                    mesh.position.set(
                        obj.position[0],
                        obj.position[1],
                        obj.position[2]
                    );
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    lungGroup.add(mesh);
                }
            });
        }

        function updateVisualization(stageIndex) {
            if (!modelData || !modelData.stages) return;
            
            const stage = modelData.stages[stageIndex];
            const data = stage.data;
            
            // Update 3D model
            createLungGeometry(stage.geometry);
            
            // Update data panel
            document.getElementById('fev1').textContent = data.fev1_percent + '%';
            document.getElementById('lung-volume').textContent = data.lung_volume + ' ml';
            document.getElementById('elasticity').textContent = Math.round(data.elasticity * 100) + '%';
            document.getElementById('alveoli-health').textContent = Math.round(data.alveoli_health * 100) + '%';
            document.getElementById('tar-deposits').textContent = data.tar_deposits + ' mg';
            document.getElementById('pm25').textContent = data.pm25_concentration + ' μg/m³';
            document.getElementById('fibrosis').textContent = Math.round(data.fibrosis_level * 100) + '%';
            document.getElementById('tumor-size').textContent = data.tumor_size + ' mm';
            
            // Update value colors based on severity
            updateValueColor('fev1', data.fev1_percent, 100, 70, 50);
            updateValueColor('elasticity', data.elasticity * 100, 100, 60, 40);
            updateValueColor('alveoli-health', data.alveoli_health * 100, 100, 70, 50);
            
            // Update current stage display
            document.getElementById('current-stage').textContent = 
                `吸烟 ${data.years_smoking} 年 - ${getStageName(data.stage)}`;
            document.getElementById('description').textContent = data.description;
            
            // Update health status
            updateHealthStatus(data);
        }

        function updateValueColor(elementId, value, good, moderate, poor) {
            const element = document.getElementById(elementId);
            element.classList.remove('data-value', 'warning', 'danger');
            
            if (value >= good) {
                element.classList.add('data-value');
            } else if (value >= moderate) {
                element.classList.add('warning');
            } else {
                element.classList.add('danger');
            }
        }

        function getStageName(stage) {
            const names = {
                'healthy': '健康肺部',
                'short_term': '短期影响',
                'medium_term': '中期影响',
                'long_term': '长期影响'
            };
            return names[stage] || stage;
        }

        function updateHealthStatus(data) {
            const statusDiv = document.getElementById('health-status');
            let status, color, bgColor, message;
            
            if (data.fev1_percent >= 80 && data.tumor_size === 0 && data.fibrosis_level < 0.1) {
                status = '健康';
                color = 'health-good';
                bgColor = '#e8f5e9';
                message = '肺部功能正常，无明显病变';
            } else if (data.fev1_percent >= 60 && data.tumor_size === 0 && data.fibrosis_level < 0.3) {
                status = '轻度受损';
                color = 'health-moderate';
                bgColor = '#fffde7';
                message = '肺功能有所下降，建议戒烟';
            } else if (data.fev1_percent >= 40 && data.tumor_size < 5) {
                status = '中度受损';
                color = 'health-poor';
                bgColor = '#fff3e0';
                message = '肺功能明显下降，存在慢性肺病风险';
            } else {
                status = '严重受损';
                color = 'health-critical';
                bgColor = '#ffebee';
                message = '肺功能严重受损，可能存在癌变风险';
            }
            
            statusDiv.style.backgroundColor = bgColor;
            statusDiv.innerHTML = `
                <span class="health-indicator ${color}"></span>
                <strong>${status}</strong>
                <p style="margin-top: 10px; font-size: 0.9em; color: #555;">
                    ${message}
                </p>
            `;
        }

        // Load model data
        async function loadModelData() {
            try {
                // Simulate loading progress
                const progress = document.getElementById('progress');
                for (let i = 0; i <= 100; i += 10) {
                    progress.style.width = i + '%';
                    await new Promise(resolve => setTimeout(resolve, 50));
                }
                
                // Generate model data using Python backend (simulated here with inline data)
                // In production, this would fetch from a Python server endpoint
                const response = await fetch('lung_model_data.json').catch(() => null);
                
                if (response && response.ok) {
                    modelData = await response.json();
                } else {
                    // Fallback: generate data inline (simplified version)
                    console.log('Using fallback data generation');
                    modelData = await generateFallbackData();
                }
                
                initScene();
                updateVisualization(0);
                
            } catch (error) {
                console.error('Error loading model data:', error);
                document.getElementById('loading').textContent = 
                    '加载失败，请刷新页面重试';
            }
        }

        async function generateFallbackData() {
            // Simplified inline data generation as fallback
            const stages = [];
            const yearPoints = [0, 1, 5, 10, 20, 30];
            
            for (const years of yearPoints) {
                const data = simulateStage(years);
                const geometry = generateGeometry(data);
                stages.push({ years, data, geometry });
            }
            
            return { time_points: yearPoints, stages };
        }

        function simulateStage(years) {
            // Simplified simulation
            const stage = years === 0 ? 'healthy' : 
                         years <= 3 ? 'short_term' :
                         years <= 10 ? 'medium_term' : 'long_term';
            
            return {
                stage,
                years_smoking: years,
                lung_volume: 6000 - years * 5 + (years > 5 ? (years - 5) * 10 : 0),
                fev1_percent: Math.max(30, 100 - years * 3),
                elasticity: Math.max(0.2, 1.0 - years * 0.04),
                alveoli_health: Math.max(0.2, 1.0 - years * 0.03),
                fibrosis_level: years > 10 ? Math.min(0.8, (years - 10) * 0.03) : 0,
                tar_deposits: years * 365 * 20 * 0.07,
                pm25_concentration: years * 20,
                tumor_size: years >= 20 ? (years - 20) * 0.3 : 0,
                bronchi_diameter: Math.max(0.3, 1.0 - years * 0.05),
                lung_color: [
                    Math.max(0.3, 1.0 - years * 0.02),
                    Math.max(0.3, 0.8 - years * 0.02),
                    Math.max(0.3, 0.8 - years * 0.02)
                ],
                description: years === 0 ? '健康肺部基线模型 - 正常的呼吸功能和结构' :
                            `吸烟${years}年的肺部变化`
            };
        }

        function generateGeometry(data) {
            const geometry = [];
            
            // Right lung lobes
            for (let i = 0; i < 3; i++) {
                geometry.push({
                    type: 'ellipsoid',
                    name: `right_lobe_${i}`,
                    position: [0.4, 0.3 - i * 0.3, 0],
                    scale: [0.25 * data.elasticity, 0.35 * data.elasticity, 0.3 * data.elasticity],
                    color: data.lung_color,
                    opacity: 0.8
                });
            }
            
            // Left lung lobes
            for (let i = 0; i < 2; i++) {
                geometry.push({
                    type: 'ellipsoid',
                    name: `left_lobe_${i}`,
                    position: [-0.4, 0.2 - i * 0.4, 0],
                    scale: [0.25 * data.elasticity, 0.4 * data.elasticity, 0.3 * data.elasticity],
                    color: data.lung_color,
                    opacity: 0.8
                });
            }
            
            // Bronchi
            const bronchiRadius = 0.03 * data.bronchi_diameter;
            geometry.push({
                type: 'cylinder',
                name: 'trachea',
                position: [0, 0.8, 0],
                radius: bronchiRadius * 1.2,
                height: 0.3,
                color: [0.9, 0.7, 0.7],
                opacity: 1.0
            });
            
            // Tumor if present
            if (data.tumor_size > 0) {
                geometry.push({
                    type: 'sphere',
                    name: 'tumor',
                    position: [0.5, 0.3, 0.1],
                    radius: data.tumor_size / 100,
                    color: [0.2, 0.2, 0.2],
                    opacity: 0.9
                });
            }
            
            return geometry;
        }

        // Event listeners
        document.getElementById('timeSlider').addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            // Map slider value to stage index
            const stageMap = { 0: 0, 1: 1, 5: 2, 10: 3, 20: 4, 30: 5 };
            let stageIndex = 0;
            
            if (value === 0) stageIndex = 0;
            else if (value <= 1) stageIndex = 1;
            else if (value <= 5) stageIndex = 2;
            else if (value <= 10) stageIndex = 3;
            else if (value <= 20) stageIndex = 4;
            else stageIndex = 5;
            
            currentStageIndex = stageIndex;
            updateVisualization(stageIndex);
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                const container = document.getElementById('canvas-container');
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            }
        });

        // Initialize on page load
        loadModelData();
    </script>
</body>
</html>
